<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>完成任务特效预览 - 10种</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7; color: #333; padding: 40px 20px;
    max-width: 1000px; margin: 0 auto;
  }
  h1 { text-align: center; margin-bottom: 8px; font-size: 26px; }
  .subtitle { text-align: center; color: #888; margin-bottom: 40px; font-size: 14px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card h3 { font-size: 14px; margin-bottom: 10px; color: #444; }
  .demo-area {
    min-height: 70px; display: flex; align-items: center;
    margin-bottom: 10px; padding: 10px; background: #fafafa; border-radius: 8px;
    position: relative; overflow: hidden;
  }
  .todo-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 12px; background: #fff; border-radius: 8px;
    border: 1px solid #eee; font-size: 13px; position: relative;
    transition: all 0.3s;
  }
  .checkbox {
    width: 22px; height: 22px; border: 2px solid #ccc; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    position: relative;
  }
  .checkbox svg {
    width: 12px; height: 12px; stroke: #fff; stroke-width: 3;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 20; stroke-dashoffset: 20;
  }
  .checkbox.checked { border-color: #4CAF50; background: #4CAF50; }
  .checkbox.checked svg { animation: drawCheck 0.3s ease-out forwards; }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  .todo-text { flex: 1; }
  .todo-item.done { opacity: 0.5; }
  .todo-item.done .todo-text { text-decoration: line-through; color: #999; }
  .btn {
    padding: 5px 14px; border: none; border-radius: 6px;
    background: #4CAF50; color: #fff; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: #45a049; }
  .btn:active { transform: scale(0.97); }

  /* 1. 光晕扩散 */
  .glow-ring {
    position: absolute; border-radius: 50%; pointer-events: none;
    border: 3px solid #4CAF50;
  }

  /* 2. 闪光扫过 */
  .shine-overlay {
    position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    pointer-events: none;
  }

  /* 3. 星星飞出 */
  .star-particle {
    position: absolute; pointer-events: none; font-size: 16px;
  }

  /* 4. 涟漪扩散 */
  .ripple-ring {
    position: absolute; border-radius: 50%; pointer-events: none;
    border: 2px solid rgba(76,175,80,0.6);
  }

  /* 5. 脉冲缩放 */
  .pulse { animation: pulseAnim 0.6s ease; }
  @keyframes pulseAnim {
    0% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(0.95); }
    75% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  /* 6. 旋转打勾 */
  .spin-check { animation: spinCheck 0.5s ease; }
  @keyframes spinCheck {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* 7. 彩虹扫过 */
  .rainbow-overlay {
    position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, #ff6b6b, #feca57, #48dbfb, #ff9ff3, transparent);
    pointer-events: none; opacity: 0.6;
  }

  /* 8. 上升淡出 */
  .float-up { animation: floatUp 0.6s ease forwards; }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-30px); opacity: 0; }
  }

  /* 9. 抖动变灰 */
  .shake-gray { animation: shakeGray 0.5s ease forwards; }
  @keyframes shakeGray {
    0% { transform: translateX(0); }
    15% { transform: translateX(-4px); }
    30% { transform: translateX(4px); }
    45% { transform: translateX(-3px); }
    60% { transform: translateX(3px); }
    75% { transform: translateX(-1px); }
    100% { transform: translateX(0); opacity: 0.5; }
  }

  /* 10. 小烟花 */
  .firework-particle {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>完成任务特效预览</h1>
<p class="subtitle">10 种特效 · 点击"播放"查看效果 · 看中哪个告诉我</p>

<div class="grid">

  <!-- 1. 光晕扩散 -->
  <div class="card">
    <h3>1. 光晕扩散</h3>
    <div class="demo-area">
      <div class="todo-item" id="t1">
        <div class="checkbox" id="c1"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">从打勾框扩散一圈光晕</span>
      </div>
    </div>
    <button class="btn" onclick="play1()">播放</button>
  </div>

  <!-- 2. 闪光扫过 -->
  <div class="card">
    <h3>2. 闪光扫过</h3>
    <div class="demo-area">
      <div class="todo-item" id="t2">
        <div class="checkbox" id="c2"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">一道白光从左扫到右</span>
      </div>
    </div>
    <button class="btn" onclick="play2()">播放</button>
  </div>

  <!-- 3. 星星飞出 -->
  <div class="card">
    <h3>3. 星星飞出</h3>
    <div class="demo-area">
      <div class="todo-item" id="t3">
        <div class="checkbox" id="c3"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">几颗星星从打勾框飞出</span>
      </div>
    </div>
    <button class="btn" onclick="play3()">播放</button>
  </div>

  <!-- 4. 涟漪扩散 -->
  <div class="card">
    <h3>4. 涟漪扩散</h3>
    <div class="demo-area">
      <div class="todo-item" id="t4">
        <div class="checkbox" id="c4"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">几圈涟漪从打勾框扩散</span>
      </div>
    </div>
    <button class="btn" onclick="play4()">播放</button>
  </div>

  <!-- 5. 脉冲缩放 -->
  <div class="card">
    <h3>5. 脉冲缩放</h3>
    <div class="demo-area">
      <div class="todo-item" id="t5">
        <div class="checkbox" id="c5"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">打勾框放大缩小脉冲几次</span>
      </div>
    </div>
    <button class="btn" onclick="play5()">播放</button>
  </div>

  <!-- 6. 旋转打勾 -->
  <div class="card">
    <h3>6. 旋转打勾</h3>
    <div class="demo-area">
      <div class="todo-item" id="t6">
        <div class="checkbox" id="c6"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">打勾框旋转360度同时打勾</span>
      </div>
    </div>
    <button class="btn" onclick="play6()">播放</button>
  </div>

  <!-- 7. 彩虹扫过 -->
  <div class="card">
    <h3>7. 彩虹扫过</h3>
    <div class="demo-area">
      <div class="todo-item" id="t7">
        <div class="checkbox" id="c7"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">彩虹色从左扫到右</span>
      </div>
    </div>
    <button class="btn" onclick="play7()">播放</button>
  </div>

  <!-- 8. 上升淡出 -->
  <div class="card">
    <h3>8. 上升淡出</h3>
    <div class="demo-area">
      <div class="todo-item" id="t8">
        <div class="checkbox" id="c8"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">任务项向上飘起并淡出</span>
      </div>
    </div>
    <button class="btn" onclick="play8()">播放</button>
  </div>

  <!-- 9. 抖动变灰 -->
  <div class="card">
    <h3>9. 抖动变灰</h3>
    <div class="demo-area">
      <div class="todo-item" id="t9">
        <div class="checkbox" id="c9"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">任务项左右抖动然后变灰</span>
      </div>
    </div>
    <button class="btn" onclick="play9()">播放</button>
  </div>

  <!-- 10. 小烟花 -->
  <div class="card">
    <h3>10. 小烟花</h3>
    <div class="demo-area">
      <div class="todo-item" id="t10">
        <div class="checkbox" id="c10"><svg viewBox="0 0 24 24"><path d="m4 10 4 4 8-9"/></svg></div>
        <span class="todo-text">从打勾框飞出小烟花爆炸</span>
      </div>
    </div>
    <button class="btn" onclick="play10()">播放</button>
  </div>

</div>

<script>
function getCheckboxPos(id) {
  const cb = document.getElementById(id);
  const rect = cb.getBoundingClientRect();
  const parent = cb.closest('.demo-area').getBoundingClientRect();
  return {
    x: rect.left - parent.left + rect.width / 2,
    y: rect.top - parent.top + rect.height / 2
  };
}

function reset(n) {
  const t = document.getElementById('t' + n);
  const c = document.getElementById('c' + n);
  t.classList.remove('done', 'float-up', 'shake-gray', 'pulse');
  c.classList.remove('checked', 'spin-check');
  // 移除动态添加的元素
  t.querySelectorAll('.glow-ring, .shine-overlay, .star-particle, .ripple-ring, .rainbow-overlay, .firework-particle').forEach(e => e.remove());
}

// 1. 光晕扩散
function play1() {
  reset(1);
  const t = document.getElementById('t1');
  const c = document.getElementById('c1');
  const pos = getCheckboxPos('c1');
  c.classList.add('checked');
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const ring = document.createElement('div');
      ring.className = 'glow-ring';
      ring.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:10px;height:10px;transform:translate(-50%,-50%);`;
      t.appendChild(ring);
      ring.animate([
        { width: '10px', height: '10px', opacity: 0.8 },
        { width: '60px', height: '60px', opacity: 0 }
      ], { duration: 600, easing: 'ease-out', fill: 'forwards' });
      setTimeout(() => ring.remove(), 700);
    }, i * 150);
  }
  setTimeout(() => t.classList.add('done'), 500);
}

// 2. 闪光扫过
function play2() {
  reset(2);
  const t = document.getElementById('t2');
  const c = document.getElementById('c2');
  c.classList.add('checked');
  const shine = document.createElement('div');
  shine.className = 'shine-overlay';
  t.appendChild(shine);
  shine.animate([
    { left: '-100%' },
    { left: '150%' }
  ], { duration: 500, easing: 'ease-in-out', fill: 'forwards' });
  setTimeout(() => { shine.remove(); t.classList.add('done'); }, 550);
}

// 3. 星星飞出
function play3() {
  reset(3);
  const t = document.getElementById('t3');
  const c = document.getElementById('c3');
  const pos = getCheckboxPos('c3');
  c.classList.add('checked');
  const stars = ['⭐', '✨', '🌟', '💫'];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'star-particle';
    s.textContent = stars[Math.floor(Math.random() * stars.length)];
    s.style.cssText = `left:${pos.x}px;top:${pos.y}px;`;
    t.appendChild(s);
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI;
    const dist = 25 + Math.random() * 35;
    s.animate([
      { transform: 'translate(-50%,-50%) scale(0.5)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1.2)`, opacity: 0 }
    ], { duration: 600 + Math.random() * 200, easing: 'ease-out', fill: 'forwards' });
    setTimeout(() => s.remove(), 900);
  }
  setTimeout(() => t.classList.add('done'), 500);
}

// 4. 涟漪扩散
function play4() {
  reset(4);
  const t = document.getElementById('t4');
  const c = document.getElementById('c4');
  const pos = getCheckboxPos('c4');
  c.classList.add('checked');
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const ring = document.createElement('div');
      ring.className = 'ripple-ring';
      ring.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:8px;height:8px;transform:translate(-50%,-50%);`;
      t.appendChild(ring);
      ring.animate([
        { width: '8px', height: '8px', opacity: 0.7 },
        { width: '50px', height: '50px', opacity: 0 }
      ], { duration: 700, easing: 'ease-out', fill: 'forwards' });
      setTimeout(() => ring.remove(), 800);
    }, i * 200);
  }
  setTimeout(() => t.classList.add('done'), 600);
}

// 5. 脉冲缩放
function play5() {
  reset(5);
  const t = document.getElementById('t5');
  const c = document.getElementById('c5');
  c.classList.add('checked');
  c.classList.add('pulse');
  setTimeout(() => { c.classList.remove('pulse'); t.classList.add('done'); }, 650);
}

// 6. 旋转打勾
function play6() {
  reset(6);
  const t = document.getElementById('t6');
  const c = document.getElementById('c6');
  c.classList.add('checked');
  c.classList.add('spin-check');
  setTimeout(() => { c.classList.remove('spin-check'); t.classList.add('done'); }, 550);
}

// 7. 彩虹扫过
function play7() {
  reset(7);
  const t = document.getElementById('t7');
  const c = document.getElementById('c7');
  c.classList.add('checked');
  const rainbow = document.createElement('div');
  rainbow.className = 'rainbow-overlay';
  t.appendChild(rainbow);
  rainbow.animate([
    { left: '-100%' },
    { left: '150%' }
  ], { duration: 600, easing: 'ease-in-out', fill: 'forwards' });
  setTimeout(() => { rainbow.remove(); t.classList.add('done'); }, 650);
}

// 8. 上升淡出
function play8() {
  reset(8);
  const t = document.getElementById('t8');
  const c = document.getElementById('c8');
  c.classList.add('checked');
  setTimeout(() => t.classList.add('float-up'), 200);
  setTimeout(() => { t.classList.remove('float-up'); t.classList.add('done'); t.style.opacity = ''; }, 850);
}

// 9. 抖动变灰
function play9() {
  reset(9);
  const t = document.getElementById('t9');
  const c = document.getElementById('c9');
  c.classList.add('checked');
  t.classList.add('shake-gray');
  setTimeout(() => { t.classList.remove('shake-gray'); t.classList.add('done'); }, 550);
}

// 10. 小烟花
function play10() {
  reset(10);
  const t = document.getElementById('t10');
  const c = document.getElementById('c10');
  const pos = getCheckboxPos('c10');
  c.classList.add('checked');
  const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181', '#AA96DA'];
  // 先飞出一个小球
  const ball = document.createElement('div');
  ball.className = 'firework-particle';
  ball.style.cssText = `left:${pos.x}px;top:${pos.y}px;background:#FFE66D;box-shadow:0 0 8px #FFE66D;`;
  t.appendChild(ball);
  ball.animate([
    { transform: 'translate(-50%,-50%) translateY(0)', opacity: 1 },
    { transform: 'translate(-50%,-50%) translateY(-25px)', opacity: 1 }
  ], { duration: 250, easing: 'ease-out', fill: 'forwards' });
  // 然后爆炸
  setTimeout(() => {
    ball.remove();
    const bx = pos.x;
    const by = pos.y - 25;
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.className = 'firework-particle';
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.cssText = `left:${bx}px;top:${by}px;background:${color};box-shadow:0 0 6px ${color};`;
      t.appendChild(p);
      const angle = (Math.PI * 2 * i) / 16;
      const dist = 20 + Math.random() * 25;
      p.animate([
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(0)`, opacity: 0 }
      ], { duration: 500 + Math.random() * 200, easing: 'ease-out', fill: 'forwards' });
      setTimeout(() => p.remove(), 800);
    }
  }, 250);
  setTimeout(() => t.classList.add('done'), 800);
}
</script>

</body>
</html>
